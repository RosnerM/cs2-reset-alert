name: CS2 Weekly Reset Alert

on:
  schedule:
    # Runs every Tuesday at 21 UTC (5pm EST)
    - cron: "0 21 * * 2"
  workflow_dispatch: # lets you run manually for testing

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Webhook
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"🎯 CS2 weekly drop reset is today at 9pm EST!\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
